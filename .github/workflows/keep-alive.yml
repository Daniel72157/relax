name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta cada 2 días a las 12:00 UTC
    - cron: '0 12 */2 * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un clic en la pestaña Actions de GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          if [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
            echo "⚠️ Advertencia: El secreto NEXT_PUBLIC_SUPABASE_URL no está configurado en GitHub Secrets."
            echo "Para activarlo: En tu repositorio de GitHub ve a Settings -> Secrets and variables -> Actions -> New repository secret."
          else
            echo "Enviando ping a Supabase REST API..."
            HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
              -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
              "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/servicios?select=id&limit=1")
            
            echo "$HTTP_RESPONSE"
            
            STATUS_CODE=$(echo "$HTTP_RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
            if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 300 ]; then
              echo "✅ Ping exitoso! Base de datos de Supabase activa (Status: $STATUS_CODE)."
            else
              echo "❌ Error al conectar con Supabase (Status: $STATUS_CODE)."
              exit 1
            fi
          fi

